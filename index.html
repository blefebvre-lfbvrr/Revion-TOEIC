<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz et flashcards de révision TOEIC : 775 questions, 12 fiches, 3 tests.">
<title>Révisions TOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single answer-sheet column; options are drawn as TOEIC answer-grid ovals (A B C D). */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --ink:#15213A; --muted:#5A6479; --line:#D9DEE7; --soft:#EBEEF4;
  --accent:#2445C9; --accent-fg:#FFFFFF; --mark:#F6D84A; --mark-ink:#15213A; --hlmark:#F6D84A;
  --ok:#1D7F47; --ok-bg:#E2F3E9; --bad:#C2362C; --bad-bg:#FBE5E2;
  --f-display:"Familjen Grotesk","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1420; --sheet:#161F31; --ink:#E6EAF2; --muted:#98A2B6; --line:#29344A; --soft:#1D2840;
  --accent:#8CA2FF; --accent-fg:#0E1420; --mark:#E3C440; --mark-ink:#15213A; --hlmark:rgb(227 196 64 / .4);
  --ok:#55C487; --ok-bg:#15301F; --bad:#F27E72; --bad-bg:#3B1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1420; --sheet:#161F31; --ink:#E6EAF2; --muted:#98A2B6; --line:#29344A; --soft:#1D2840;
  --accent:#8CA2FF; --accent-fg:#0E1420; --mark:#E3C440; --mark-ink:#15213A; --hlmark:rgb(227 196 64 / .4);
  --ok:#55C487; --ok-bg:#15301F; --bad:#F27E72; --bad-bg:#3B1D1A; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,42px);line-height:1.05;font-weight:700}
h2{font-size:19px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--hlmark) 58%,var(--hlmark) 92%,transparent 92%);padding:0 .08em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.top .lead{display:flex;flex-direction:column;gap:10px;min-width:0}
.next{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.next b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 2px color-mix(in srgb,var(--mark) 35%,transparent)}

section.block{display:flex;flex-direction:column;gap:12px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500}
.linkbtn:hover{text-decoration:underline}

/* test cards */
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tests{grid-template-columns:1fr}}
.tcard{position:relative;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.tcard[aria-pressed="true"]{border-color:var(--ink)}
.tcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:17px}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.tcard[aria-pressed="true"] .check{background:var(--ink);border-color:var(--ink)}
.tcard[aria-pressed="true"] .check::after{content:"";width:9px;height:5px;border-left:2px solid var(--sheet);border-bottom:2px solid var(--sheet);transform:translateY(-1px) rotate(-45deg)}
.tdate{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tdate .soon{color:var(--ink);background:var(--mark);color:var(--mark-ink);padding:1px 6px;border-radius:4px;margin-left:4px}
.tthemes{font-size:12.5px;color:var(--muted);line-height:1.4}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px}
.tmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chip[aria-pressed="true"] small{color:color-mix(in srgb,var(--sheet) 70%,transparent)}
.chip:disabled{opacity:.4;cursor:not-allowed}

.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.opts-row{display:flex;flex-wrap:wrap;gap:20px 32px}
.opts-row>div{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted)}

.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:0;border-radius:9px;padding:12px 20px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn{display:inline-block;cursor:pointer}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);padding:10.5px 18px}
.btn.small{padding:8px 14px;font-size:13.5px}

/* progress table */
.prog{background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r);overflow-x:auto}
.prog table{width:100%;border-collapse:collapse;font-size:13.5px}
.prog th,.prog td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.prog tr:last-child td{border-bottom:0}
.prog th{font-weight:500;color:var(--muted);font-size:12px}
.prog td.r,.prog th.r{text-align:right}
.prog td .bar{width:90px;display:inline-block;vertical-align:middle}
.prog .tlabel td{background:var(--soft);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:6px}
.foot{font-size:12.5px;color:var(--muted);line-height:1.55;max-width:65ch}

/* confirm */
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);border-radius:9px;padding:10px 14px;font-size:13.5px}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.qbar .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qbar .stats{display:flex;gap:16px;font-size:13.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.qbar .stats b{color:var(--ink);font-weight:600}
.track{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:20px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;border-radius:6px;padding:3px 8px;background:var(--soft);color:var(--muted);font-weight:500}
.tag.id{font-family:var(--f-mono);font-size:11px}
.qtext{font-family:var(--f-display);font-size:clamp(20px,3.6vw,25px);font-weight:600;line-height:1.3;text-wrap:pretty}
.answers{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.ans{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:none;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;transition:border-color .12s,background .12s}
.ans:hover:not(:disabled){border-color:var(--ink)}
.ans:disabled{cursor:default}
.oval{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.ans .txt{min-width:0;overflow-wrap:anywhere}
.ans.sel{border-color:var(--ink);background:var(--soft)}
.ans.sel .oval{background:var(--ink);color:var(--sheet)}
.ans.ok{border-color:var(--ok);background:var(--ok-bg)}
.ans.ok .oval{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.ans.bad{border-color:var(--bad);background:var(--bad-bg)}
.ans.bad .oval{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.ans.dim{opacity:.55}
.feedback{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback strong{font-weight:600}
.feedback.ok strong{color:var(--ok)} .feedback.bad strong{color:var(--bad)}
.feedback .src{font-size:12.5px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* results */
.score{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:flex-end}
.big{font-family:var(--f-display);font-size:clamp(52px,12vw,76px);font-weight:700;line-height:.9;letter-spacing:-.03em}
.big small{font-size:.4em;color:var(--muted);font-weight:600;letter-spacing:0}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-size:18px;font-weight:600}
.verdict{font-size:15.5px;max-width:60ch}
.themes-res{display:flex;flex-direction:column;gap:10px}
.tres{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:12px;align-items:center;font-size:14px}
@media (max-width:480px){.tres{grid-template-columns:minmax(0,1fr) 70px 48px}}
.tres .bar{height:8px}
.tres .r{text-align:right}
.mistakes{display:flex;flex-direction:column;gap:10px}
.mk{background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mk .q{font-weight:600;font-size:15px}
.mk .line{display:flex;gap:8px;align-items:baseline}
.mk .line b{font-family:var(--f-mono);font-size:11px;font-weight:500;min-width:72px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mk .yours{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mk .good{color:var(--ok);font-weight:600}
.empty{background:var(--ok-bg);border-radius:var(--r);padding:16px;font-size:14.5px}

.fc{perspective:1400px}
.fc-inner{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer;border-radius:14px}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);min-height:320px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fc-back{transform:rotateY(180deg);border-color:var(--ink)}
.fc-mid{margin-block:auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
.fc-term{font-family:var(--f-display);font-size:clamp(28px,6.5vw,40px);font-weight:600;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.fc-term.long{font-size:clamp(20px,3.8vw,26px);line-height:1.3}
.fc-ctx{font-size:13.5px;color:var(--muted)}
.fc-expl{font-size:14.5px}
.fc-foot{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.fc-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.fc-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.btn.again{background:var(--bad-bg);color:var(--bad);border:1.5px solid var(--bad)}
.btn.knew{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.btn .kbd{margin-left:8px;color:inherit;border-color:currentColor;opacity:.7}
.hintline{font-size:14px;color:var(--muted)}
.hintline b{color:var(--ink);font-weight:500}
.progfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 20px}
.sync{font-size:12.5px;color:var(--muted);display:inline-flex;gap:8px;align-items:center;max-width:60ch}
.sync::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-ok::before{background:var(--ok)}
.sync-saving::before,.sync-connecting::before{background:var(--mark)}
.sync-error::before,.sync-unreach::before{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){body{font-size:14.5px}.ans{font-size:15px;padding:10px 12px}.hide-sm{display:none}}
</style>

</head>

<script type="application/json" id="qdata">[{"id":"Q001","t":0,"th":"Make ou do","ty":"QCM","q":"On emploie ___ pour parler du travail et des corvées.","o":["make","do"],"a":1,"e":"Travail, corvées → do (do the dishes, do work).","s":"Fiche 22. Make ou do ?, Ex. 1"},{"id":"Q002","t":0,"th":"Make ou do","ty":"QCM","q":"On emploie ___ pour créer ou fabriquer quelque chose de concret.","o":["make","do"],"a":0,"e":"Créer / fabriquer → make (make a cake, make a copy).","s":"Fiche 22. Make ou do ?, Ex. 1"},{"id":"Q003","t":0,"th":"Make ou do","ty":"QCM","q":"On emploie ___ pour parler d'une activité non précisée.","o":["make","do"],"a":1,"e":"Activité vague → do (do something, do nothing).","s":"Fiche 22. Make ou do ?, Ex. 1"},{"id":"Q004","t":0,"th":"Make ou do","ty":"QCM","q":"On emploie ___ pour une activité longue ou répétée, un passe-temps.","o":["make","do"],"a":1,"e":"Passe-temps → do (do some reading, do a lot of cycling).","s":"Fiche 22. Make ou do ?, Ex. 1"},{"id":"Q005","t":0,"th":"Make ou do","ty":"QCM","q":"Pour traduire « rendre heureux / triste », on emploie :","o":["make + to + verbe","get + adjectif","make + adjectif","do + adjectif"],"a":2,"e":"make + sentiment : The long weekend made all the employees very happy.","s":"Fiche 22. Make ou do ?"},{"id":"Q006","t":0,"th":"Make ou do","ty":"QCM","q":"The long weekend ___ all the employees very happy.","o":["did","made","took","had"],"a":1,"e":"make + adjectif = rendre (un sentiment).","s":"Fiche 22. Make ou do ?"},{"id":"Q007","t":0,"th":"Make ou do","ty":"QCM","q":"Uncle Thomas' stories always made us ___.","o":["laugh","laughed","laughing","to laugh"],"a":0,"e":"make + base verbale, sans to (faire rire).","s":"Fiche 22. Make ou do ?"},{"id":"Q008","t":0,"th":"Make ou do","ty":"QCM","q":"Try not to make that vase ___!","o":["fall","to fall","falling","fell"],"a":0,"e":"make + base verbale : faire tomber.","s":"Fiche 22. Make ou do ?"},{"id":"Q009","t":0,"th":"Make ou do","ty":"QCM","q":"I love ___ things wi ":"Traduction FR → EN","q":"Comment dit-on « avancer (une date) » ?","o":["chart","item","move up","projector"],"a":2,"e":"synonyme : bring forward","s":"Fiche 6. Meetings and presentations"},{"id":"Q768","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « vue d'ensemble » ?","o":["overview","screen","item","resume"],"a":0,"e":"","s":"Fiche 6. Meetings and presentations"},{"id":"Q769","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « reporter » ?","o":["hold (held / held)","move up","screen","postpone"],"a":3,"e":"postponement · = put off","s":"Fiche 6. Meetings and presentations"},{"id":"Q770","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « projecteur » ?","o":["screen","postpone","projector","closed (adj)"],"a":2,"e":"project projeter","s":"Fiche 6. Meetings and presentations"},{"id":"Q771","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « reprendre » ?","o":["item","resume","move up","chart"],"a":1,"e":"resumption reprise","s":"Fiche 6. Meetings and presentations"},{"id":"Q772","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « avis ; passer en revue » ?","o":["review","projector","resume","conclude"],"a":0,"e":"reviewer critique","s":"Fiche 6. Meetings and presentations"},{"id":"Q773","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « écran » ?","o":["resume","lead (led / led)","screen","graph"],"a":2,"e":"","s":"Fiche 6. Meetings and presentations"},{"id":"Q774","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « résumer » ?","o":["sum up","postpone","conclude","item"],"a":0,"e":"summary · summarize","s":"Fiche 6. Meetings and presentations"},{"id":"Q775","t":2,"th":"Meetings and presentations","ty":"Traduction FR → EN","q":"Comment dit-on « avoir lieu » ?","o":["chart","take place (took / taken)","be se <script>
(function(){
"use strict";
const Q = JSON.parse(document.getElementById('qdata').textContent);
const BY_ID = Object.fromEntries(Q.map(q=>[q.id,q]));
const TESTS = [
  {name:'Test 1', date:[10,15], label:'15 oct.'},
  {name:'Test 2', date:[11,5],  label:'5 nov.'},
  {name:'Test 3', date:[11,26], label:'26 nov.'}
];
const TYPES = ['QCM','Traduction EN → FR','Traduction FR → EN','Make ou do'];
const TYPE_LABEL = {'Make ou do':'Expressions make / do'};
const tyLabel = t => TYPE_LABEL[t] || t;
const THEMES = [[],[],[]];
Q.forEach(q=>{ if(!THEMES[q.t].includes(q.th)) THEMES[q.t].push(q.th); });
const LETTERS = 'ABCD';

/* ---------- storage (per browser) ---------- */
const KEY_P='toeic.progress.v1', KEY_S='toeic.setup.v1';
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let progress = load(KEY_P,{});           // id -> {c,w,l} correct count, wrong count, last result (1/0)
function record(id,ok){
  const p = progress[id] || {c:0,w:0,l:0};
  if(ok) p.c++; else p.w++;
  p.l = ok?1:0; progress[id]=p; save(KEY_P,progress);
  scheduleSync();
}

/* ---------- progress helpers ---------- */
let resetAt = load('toeic.resetAt.v1', 0);
let ioMsg = '';
function exportProgress(){
  const data = JSON.stringify({app:'revisions-toeic', v:1, exportedAt:new Date().toISOString(), p:progress, resetAt, s:setup});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download = 'progression-toeic-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  ioMsg = 'Progression exportée dans tes téléchargements.'; renderSetup();
}
function importProgress(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || d.app!=='revisions-toeic' || !d.p || typeof d.p!=='object') throw new Error('format');
      progress = mergeProgress(progress, d.p); save(KEY_P, progress);
      ioMsg = 'Progression importée : '+Object.keys(progress).length+' questions suivies.';
    }catch(e){ ioMsg = 'Ce fichier n’est pas une sauvegarde de Révisions TOEIC. Choisis un fichier « progression-toeic-….json ».'; }
    renderSetup();
  };
  r.readAsText(file);
}
const sync = {state:'connecting', ref:null, writing:false, pending:false, timer:null};
const SYNC_MSG = {
  connecting:'Connexion à ta sauvegarde…',
  ok:'Progression sauvegardée sur ton compte Claude, retrouvée sur tous tes appareils',
  saving:'Sauvegarde en cours…',
  error:'La dernière sauvegarde a échoué. Nouvel essai à ta prochaine réponse ; rien n’est perdu dans ce navigateur.',
  unreach:'Sauvegarde du compte injoignable pour le moment. Ta progression reste dans ce navigateur ; recharge la page plus tard.',
  off:'Progression enregistrée dans ce navigateur seulement. Ouvre la page connecté à claude.ai pour la sauvegarder sur ton compte.'
};
function syncBadge(){ return h('span',{class:'sync sync-'+sync.state,id:'sync-status',role:'status'}, SYNC_MSG[sync.state]); }
function setSync(s){ sync.state=s; const el=document.getElementById('sync-status'); if(el) el.replaceWith(syncBadge()); }
function scheduleSync(){ if(!sync.ref) return; clearTimeout(sync.timer); sync.timer=setTimeout(flush,1200); }
async function flush(){
  if(!sync.ref) return;
  clearTimeout(sync.timer); sync.timer=null;
  if(sync.writing){ sync.pending=true; return; }
  sync.writing=true; setSync('saving');
  try{ await sync.ref.set({v:1, p:progress, resetAt, s:setup, savedAt:Date.now()}); setSync('ok'); }
  catch(e){ setSync('error'); }
  sync.writing=false;
  if(sync.pending){ sync.pending=false; flush(); }
}
function validEntry(e){ return e && typeof e==='object' && Number.isFinite(e.c) && Number.isFinite(e.w); }
function mergeProgress(local, cloud){
  const out = {};
  for(const id of new Set([...Object.keys(local), ...Object.keys(cloud)])){
    if(!BY_ID[id]) continue;
    const a = validEntry(local[id]) ? local[id] : null, b = validEntry(cloud[id]) ? cloud[id] : null;
    if(!a) out[id]={c:b.c,w:b.w,l:b.l?1:0};
    else if(!b) out[id]=a;
    else out[id] = (a.c+a.w) > (b.c+b.w) ? a : {c:b.c,w:b.w,l:b.l?1:0};
  }
  return out;
}
async function initSync(){
  if(!window.claude || typeof window.claude.use!=='function'){ setSync('off'); return; }
  const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  const uid = user ? await user.id() : null;
  if(!db || !uid){ setSync('off'); return; }
  let ref;
  try{ ref = db.collection('data/users/'+uid).doc('toeic'); }catch(e){ setSync('off'); return; }
  let snap;
  try{
    snap = await new Promise((res,rej)=>{ const t=setTimeout(()=>rej({code:'timeout'}),10000); ref.get().then(v=>{clearTimeout(t);res(v);}, e=>{clearTimeout(t);rej(e);}); });
  }catch(e){ setSync('unreach'); return; }   // never write over a backup we could not read
  sync.ref = ref;
  const cloud = snap.exists ? (snap.data()||{}) : null;
  if(cloud){
    const cReset = Number(cloud.resetAt)||0;
    let local = progress;
    if(cReset > resetAt){ local = {}; resetAt = cReset; save('toeic.resetAt.v1', resetAt); }
    const merged = mergeProgress(local, (cloud.p && typeof cloud.p==='object') ? cloud.p : {});
    const changed = JSON.stringify(merged)!==JSON.stringify(progress);
    const needsWrite = JSON.stringify(merged)!==JSON.stringify(cloud.p||{}) || resetAt>cReset;
    progress = merged; save(KEY_P, progress);
    if(cloud.s && typeof cloud.s==='object' && !load(KEY_S,null)){ Object.assign(setup, cloud.s); save(KEY_S,setup); }
    if(changed && document.getElementById('start')) renderSetup();
    if(needsWrite) flush(); else setSync('ok');
  } else {
    flush();   // first backup of this browser's progress
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && sync.timer) flush(); });

/* ---------- setup state ---------- */
const defSetup = {tests:[2], themes:null, types:TYPES.slice(), count:20, mode:'train'};
let setup = Object.assign({}, defSetup, load(KEY_S,{}));
if(!Array.isArray(setup.tests)) setup.tests=[2];
if(!Array.isArray(setup.themes)) setup.themes = THEMES.flat();
if(!Array.isArray(setup.types)) setup.types = TYPES.slice();

let quiz = null;      // active quiz
let lastResult = null;
let confirmReset = false, confirmQuit = false;
let timerId = null;
let deck = null;      // active flashcard session

/* ---------- helpers ---------- */
const app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='html') el.innerHTML=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pct(n,d){ return d?Math.round(100*n/d):0; }
function fmtTime(s){ const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }
function testDate(t){
  const now=new Date(); let y=now.getFullYear(); if(now.getMonth()<7) y--; // school year starting in autumn
  return new Date(y, TESTS[t].date[0]-1, TESTS[t].date[1]);
}
function daysUntil(t){ const d=testDate(t), n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/864e5); }
function mastery(ids){ let seen=0, ok=0; ids.forEach(id=>{const p=progress[id]; if(p){seen++; if(p.l) ok++;}}); return {seen, ok, total:ids.length}; }
function idsWhere(f){ return Q.filter(f).map(q=>q.id); }
function wrongIds(){ return Q.filter(q=>progress[q.id] && !progress[q.id].l).map(q=>q.id); }

function pool(){
  return Q.filter(q=> setup.tests.includes(q.t) && setup.themes.includes(q.th) && setup.types.includes(q.ty));
}

function slug(s){ return s.normalize('NFD').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase(); }
function persist(){ save(KEY_S,setup); scheduleSync(); }

/* ---------- QUIZ ---------- */
function startQuiz(ids, mode){
  if(mode==='cards') return startCards(ids);
  confirmQuit=false; deck=null;
  quiz = {
    ids, mode, i:0, start:Date.now(),
    order: ids.map(id=>{ const n=BY_ID[id].o.length; const base=[...Array(n).keys()]; return n>2?shuffle(base):base; }),
    chosen: ids.map(()=>null),  // original option index
    locked: ids.map(()=>false)
  };
  if(mode==='exam') startTimer();
  renderQuiz(); window.scrollTo(0,0);
}
function startTimer(){ stopTimer(); timerId=setInterval(()=>{ const el=document.getElementById('clock'); if(el&&quiz) el.textContent=fmtTime(Math.floor((Date.now()-quiz.start)/1000)); },1000); }
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }

function choose(k){
  const qi=quiz.i; if(quiz.locked[qi]) return;
  const orig = quiz.order[qi][k]; if(orig==null) return;
  quiz.chosen[qi]=orig;
  if(quiz.mode==='train'){
    quiz.locked[qi]=true;
    record(quiz.ids[qi], orig===BY_ID[quiz.ids[qi]].a);
  }
  renderQuiz();
  if(quiz.mode==='train'){ const nb=document.getElementById('next'); if(nb) nb.focus({preventScroll:true}); }
}
function next(){
  const qi=quiz.i;
  if(quiz.chosen[qi]==null) return;
  if(quiz.mode==='exam') quiz.locked[qi]=true;
  if(qi+1>=quiz.ids.length) return finish();
  quiz.i++; renderQuiz(); window.scrollTo({top:0});
}
function prev(){ if(quiz.mode==='exam' && quiz.i>0){ quiz.i--; quiz.locked[quiz.i]=false; renderQuiz(); } }

function finish(){
  stopTimer();
  const secs = Math.floor((Date.now()-quiz.start)/1000);
  const items = quiz.ids.map((id,i)=>({q:BY_ID[id], chosen:quiz.chosen[i]})).filter(x=>x.chosen!=null);
  if(quiz.mode==='exam') items.forEach(x=>record(x.q.id, x.chosen===x.q.a));
  lastResult = {items, secs, mode:quiz.mode, planned:quiz.ids.length};
  quiz=null; renderResults(); window.scrollTo(0,0);
}

function renderQuiz(){
  app.replaceChildren();
  const qi=quiz.i, q=BY_ID[quiz.ids[qi]], N=quiz.ids.length;
  const answered = quiz.chosen.filter(c=>c!=null).length;
  let good=0, bad=0;
  quiz.ids.forEach((id,i)=>{ if(quiz.locked[i] && quiz.mode==='train'){ if(quiz.chosen[i]===BY_ID[id].a) good++; else bad++; } });

  // progress track
  const track = h('div',{class:'track','aria-hidden':'true'});
  if(quiz.mode==='train'){
    track.append(h('i',{style:'width:'+(100*good/N)+'%;background:var(--ok)'}), h('i',{style:'width:'+(100*bad/N)+'%;background:var(--bad)'}));
  } else track.append(h('i',{style:'width:'+(100*answered/N)+'%;background:var(--ink)'}));

  app.append(h('div',{class:'qbar'},
    h('div',{class:'row'},
      h('div',{class:'stats'},
        h('span',{class:'num'}, 'Question ', h('b',null,(qi+1)+' / '+N)),
        quiz.mode==='train'
          ? h('span',{class:'num'}, h('b',{style:'color:var(--ok)'},good), ' juste'+(good>1?'s':''), ' · ', h('b',{style:'color:var(--bad)'},bad), ' faute'+(bad>1?'s':''))
          : h('span',{class:'num'}, 'Examen blanc · ', h('b',{id:'clock'}, fmtTime(Math.floor((Date.now()-quiz.start)/1000))))
      ),
      confirmQuit
        ? h('div',{class:'stats'}, 'Arrêter ?',
            h('button',{class:'btn small',id:'quit-yes',onclick:()=>{confirmQuit=false; answered?finish():(quiz=null,renderSetup());}}, answered?'Voir le bilan':'Quitter'),
            h('button',{class:'btn small ghost',id:'quit-no',onclick:()=>{confirmQuit=false;renderQuiz();}},'Continuer'))
        : h('button',{class:'btn small ghost',id:'quit',onclick:()=>{confirmQuit=true;renderQuiz();}},'Arrêter')
    ),
    track
  ));

  const locked = quiz.locked[qi] && quiz.mode==='train';
  const chosen = quiz.chosen[qi];
  const list = h('ul',{class:'answers'});
  quiz.order[qi].forEach((orig,k)=>{
    let cls='ans';
    if(locked){
      if(orig===q.a) cls+=' ok';
      else if(orig===chosen) cls+=' bad';
      else cls+=' dim';
    } else if(orig===chosen) cls+=' sel';
    list.append(h('li',null, h('button',{class:cls,id:'opt-'+k,disabled:locked,onclick:()=>choose(k)},
      h('span',{class:'oval'},LETTERS[k]), h('span',{class:'txt'},q.o[orig]))));
  });

  let fb=null;
  if(locked){
    const ok = chosen===q.a;
    const corrLetter = LETTERS[quiz.order[qi].indexOf(q.a)];
    fb = h('div',{class:'feedback '+(ok?'ok':'bad'),role:'status'},
      h('strong',null, ok?'Bonne réponse':'Réponse : '+corrLetter+' — '+q.o[q.a]),
      q.e ? h('span',null,q.e) : null,
      q.s ? h('span',{class:'src'}, q.s) : null);
  }

  const last = qi+1>=N;
  app.append(h('article',{class:'sheet'},
    h('div',{class:'qmeta'}, h('span',{class:'tag'},q.th), h('span',{class:'tag'},tyLabel(q.ty)), h('span',{class:'tag id'},q.id)),
    h('p',{class:'qtext'}, q.q),
    list, fb,
    h('div',{class:'qnav'},
      h('span',{class:'hint hide-sm'}, h('span',{class:'kbd'},'A'),'–',h('span',{class:'kbd'},'D'),' pour répondre, ',h('span',{class:'kbd'},'Entrée'),' pour continuer'),
      h('div',{class:'cta'},
        quiz.mode==='exam' && qi>0 ? h('button',{class:'btn ghost',id:'prev',onclick:prev},'Précédente') : null,
        h('button',{class:'btn',id:'next',disabled:chosen==null,onclick:next}, last ? 'Voir le bilan' : 'Suivante'))
    )
  ));
}

/* ---------- RESULTS ---------- */
function renderResults(){
  app.replaceChildren();
  const r = lastResult, items=r.items;
  const ok = items.filter(x=>x.chosen===x.q.a).length, n=items.length, p=pct(ok,n);
  const verdict = p>=90?'Excellent, ces thèmes sont acquis.' : p>=75?'Solide. Revois les quelques erreurs ci-dessous.' : p>=50?'En bonne voie. Refais les erreurs puis relance un quiz sur les thèmes les plus faibles.' : 'À retravailler : relis les fiches des thèmes en rouge, puis refais les erreurs.';

  app.append(h('header',{class:'top'},
    h('div',{class:'lead'},
      h('span',{class:'eyebrow'}, r.mode==='exam'?'Bilan · examen blanc':'Bilan · entraînement'),
      h('h1',null,'Ton score'))));

  app.append(h('section',{class:'block'},
    h('div',{class:'score'},
      h('div',{class:'big num'}, p, h('small',null,' %')),
      h('div',{class:'kv'}, h('span',null,'Bonnes réponses'), h('b',{class:'num'}, ok+' / '+n)),
      h('div',{class:'kv'}, h('span',null,'Durée'), h('b',{class:'num'}, fmtTime(r.secs))),
      n<r.planned ? h('div',{class:'kv'}, h('span',null,'Non répondues'), h('b',{class:'num'}, r.planned-n)) : null),
    h('p',{class:'verdict'}, verdict)));

  // per theme
  const by = {};
  items.forEach(x=>{ const t=by[x.q.th]||(by[x.q.th]={n:0,ok:0}); t.n++; if(x.chosen===x.q.a) t.ok++; });
  const rows = Object.entries(by).sort((a,b)=>a[1].ok/a[1].n - b[1].ok/b[1].n);
  app.append(h('section',{class:'block'}, h('h2',null,'Par thème'),
    h('div',{class:'themes-res'}, rows.map(([th,v])=>{
      const pp=pct(v.ok,v.n), col = pp>=75?'var(--ok)':pp>=50?'var(--mark)':'var(--bad)';
      return h('div',{class:'tres'}, h('span',null,th), h('div',{class:'bar'},h('i',{style:'width:'+pp+'%;background:'+col})), h('span',{class:'r num'}, v.ok+'/'+v.n));
    }))));

  const wrong = items.filter(x=>x.chosen!==x.q.a);
  app.append(h('div',{class:'cta'},
    wrong.length ? h('button',{class:'btn',id:'redo',onclick:()=>startQuiz(shuffle(wrong.map(x=>x.q.id)),'train')}, 'Refaire mes '+wrong.length+' erreur'+(wrong.length>1?'s':'')) : null,
    h('button',{class:wrong.length?'btn ghost':'btn',id:'again',onclick:renderSetup}, 'Nouveau quiz')));

  app.append(h('section',{class:'block'}, h('h2',null, wrong.length?'Corrections':'Corrections'),
    wrong.length ? h('div',{class:'mistakes'}, wrong.map(x=>h('div',{class:'mk'},
      h('div',{class:'qmeta'}, h('span',{class:'tag'},x.q.th), h('span',{class:'tag id'},x.q.id)),
      h('p',{class:'q'}, x.q.q),
      h('div',{class:'line'}, h('b',null,'Ta réponse'), h('span',{class:'yours'}, x.q.o[x.chosen])),
      h('div',{class:'line'}, h('b',null,'Correct'), h('span',{class:'good'}, x.q.o[x.q.a])),
      x.q.e ? h('p',{class:'muted'}, x.q.e) : null
    ))) : h('p',{class:'empty'}, 'Aucune erreur sur ce quiz.')));
}

/* ---------- FLASHCARDS ---------- */
function cardFace(q){
  let m = q.q.match(/^Que signifie (?:l'adverbe )?« (.+) » \?$/);
  if(m) return {label:'Traduis en français', term:m[1]};
  m = q.q.match(/^Comment dit-on « (.+) » \?$/);
  if(m) return {label:'Traduis en anglais', term:m[1]};
  return {label: q.ty==='Make ou do' ? 'Make ou do ?' : 'Trouve la réponse', term:q.q};
}
function startCards(ids){
  confirmQuit=false; quiz=null; stopTimer();
  deck = {queue:ids.slice(), total:ids.length, i:0, flipped:false, hint:false, first:{}, again:new Set(), start:Date.now()};
  renderCards(); window.scrollTo(0,0);
}
function flipCard(){
  if(!deck || deck.flipped) return;
  deck.flipped = true;
  const fc = document.getElementById('fc'); if(fc) fc.classList.add('flipped');
  renderCardActions();
  const k = document.getElementById('knew'); if(k) k.focus({preventScroll:true});
}
function grade(knew){
  if(!deck || !deck.flipped) return;
  const id = deck.queue[deck.i];
  record(id, knew);
  if(!(id in deck.first)) deck.first[id] = knew;
  if(!knew){ deck.again.add(id); deck.queue.push(id); }
  deck.i++; deck.flipped=false; deck.hint=false;
  if(deck.i>=deck.queue.length) return finishCards();
  renderCards();
}
function renderCards(){
  app.replaceChildren();
  const q = BY_ID[deck.queue[deck.i]], face = cardFace(q);
  const left = deck.queue.length - deck.i;
  const known = Object.values(deck.first).filter(Boolean).length;
  const graded = Object.keys(deck.first).length;
  app.append(h('div',{class:'qbar'},
    h('div',{class:'row'},
      h('div',{class:'stats'},
        h('span',{class:'num'}, 'Flashcards · ', h('b',null, left+' restante'+(left>1?'s':''))),
        h('span',{class:'num'}, h('b',{style:'color:var(--ok)'},known), ' sue'+(known>1?'s':''), ' · ', h('b',{style:'color:var(--bad)'},deck.again.size), ' à revoir')),
      confirmQuit
        ? h('div',{class:'stats'}, 'Arrêter ?',
            h('button',{class:'btn small',id:'quit-yes',onclick:()=>{confirmQuit=false; graded?finishCards():renderSetup();}}, graded?'Voir le bilan':'Quitter'),
            h('button',{class:'btn small ghost',id:'quit-no',onclick:()=>{confirmQuit=false;renderCards();}},'Continuer'))
        : h('button',{class:'btn small ghost',id:'quit',onclick:()=>{confirmQuit=true;renderCards();}},'Arrêter')),
    h('div',{class:'track','aria-hidden':'true'}, h('i',{style:'width:'+(100*deck.i/deck.queue.length)+'%;background:var(--ink)'}))
  ));
  const repeat = deck.first[q.id]===false;
  const meta = ()=>h('div',{class:'qmeta'}, h('span',{class:'tag'},q.th), h('span',{class:'tag'},tyLabel(q.ty)), repeat?h('span',{class:'tag',style:'background:var(--bad-bg);color:var(--bad)'},'À revoir'):null);
  const front = h('div',{class:'fc-face fc-front'},
    meta(),
    h('div',{class:'fc-mid'}, h('span',{class:'eyebrow'},face.label), h('p',{class:'fc-term'+(face.term.length>48?' long':'')}, face.term)),
    h('div',{class:'fc-foot'}, h('span',null,'Touche la carte pour la retourner'), h('span',{class:'tag id'},q.id)));
  const ans = q.o[q.a];
  const back = h('div',{class:'fc-face fc-back','aria-hidden':'true'},
    meta(),
    h('div',{class:'fc-mid'},
      h('span',{class:'eyebrow'},'Réponse'),
      h('p',{class:'fc-term'+(ans.length>48?' long':'')}, h('span',{class:'hl'},ans)),
      face.term!==q.q ? null : h('p',{class:'fc-ctx'}, q.q),
      q.e ? h('p',{class:'fc-expl'}, q.e) : null),
    h('div',{class:'fc-foot'}, h('span',null,q.s||''), h('span',{class:'tag id'},q.id)));
  const inner = h('div',{class:'fc-inner',id:'card',role:'button',tabindex:'0','aria-label':'Retourner la carte',onclick:flipCard}, front, back);
  app.append(h('div',{class:'fc'+(deck.flipped?' flipped':''),id:'fc'}, inner));
  app.append(h('div',{class:'fc-actions',id:'fc-actions'}));
  renderCardActions();
}
function renderCardActions(){
  const box = document.getElementById('fc-actions'); if(!box) return;
  const q = BY_ID[deck.queue[deck.i]];
  box.replaceChildren();
  const back = document.querySelector('.fc-back'), front = document.querySelector('.fc-front');
  if(back) back.setAttribute('aria-hidden', String(!deck.flipped));
  if(front) front.setAttribute('aria-hidden', String(deck.flipped));
  if(deck.flipped){
    box.append(h('div',{class:'fc-grade'},
      h('button',{class:'btn again',id:'again-card',onclick:()=>grade(false)}, 'À revoir', h('span',{class:'kbd hide-sm'},'←')),
      h('button',{class:'btn knew',id:'knew',onclick:()=>grade(true)}, 'Je savais', h('span',{class:'kbd hide-sm'},'→'))));
  } else {
    const hasChoices = !cardFace(q).label.startsWith('Traduis');
    box.append(
      h('button',{class:'btn',id:'flip',onclick:flipCard}, 'Retourner la carte', h('span',{class:'kbd hide-sm'},'Espace')),
      ...(hasChoices ? [deck.hint
        ? h('p',{class:'hintline'}, 'Propositions : ', h('b',null, q.o.join(' · ')))
        : h('button',{class:'linkbtn',id:'hint',onclick:()=>{deck.hint=true;renderCardActions();}}, 'Indice : voir les propositions')] : []));
  }
}
function finishCards(){
  const d = deck; deck = null;
  app.replaceChildren();
  const ids = Object.keys(d.first);
  const known = ids.filter(id=>d.first[id]).length;
  const again = [...d.again];
  app.append(h('header',{class:'top'}, h('div',{class:'lead'},
    h('span',{class:'eyebrow'},'Bilan · flashcards'), h('h1',null,'Série terminée'))));
  app.append(h('section',{class:'block'},
    h('div',{class:'score'},
      h('div',{class:'big num'}, known, h('small',null,' / '+ids.length)),
      h('div',{class:'kv'}, h('span',null,'Sues du premier coup'), h('b',{class:'num'}, pct(known,ids.length)+' %')),
      h('div',{class:'kv'}, h('span',null,'À revoir'), h('b',{class:'num'}, again.length)),
      h('div',{class:'kv'}, h('span',null,'Durée'), h('b',{class:'num'}, fmtTime(Math.floor((Date.now()-d.start)/1000))))),
    h('p',{class:'verdict'}, again.length ? 'Les cartes ratées sont revenues jusqu’à ce que tu les saches. Teste-les maintenant en quiz pour vérifier qu’elles sont acquises.' : 'Tout su du premier coup.')));
  app.append(h('div',{class:'cta'},
    again.length ? h('button',{class:'btn',id:'cards-again',onclick:()=>startCards(shuffle(again))}, 'Revoir ces '+again.length+' cartes') : null,
    again.length ? h('button',{class:'btn ghost',id:'cards-quiz',onclick:()=>startQuiz(shuffle(again),'train')}, 'Les tester en quiz') : null,
    h('button',{class:again.length?'btn ghost':'btn',id:'cards-new',onclick:renderSetup}, 'Nouvelle série')));
  if(again.length) app.append(h('section',{class:'block'}, h('h2',null,'Cartes à revoir'),
    h('div',{class:'mistakes'}, again.map(id=>{ const q=BY_ID[id], f=cardFace(q); return h('div',{class:'mk'},
      h('div',{class:'qmeta'}, h('span',{class:'tag'},q.th), h('span',{class:'tag id'},q.id)),
      h('p',{class:'q'}, f.term),
      h('div',{class:'line'}, h('b',null,'Réponse'), h('span',{class:'good'}, q.o[q.a])),
      q.e ? h('p',{class:'muted'}, q.e) : null); }))));
  window.scrollTo(0,0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if(deck && !e.ctrlKey && !e.metaKey && !e.altKey){
    const k = e.key, onBtn = document.activeElement && document.activeElement.tagName==='BUTTON';
    if(!deck.flipped && (k===' ' || k==='Enter')){ if(onBtn) return; e.preventDefault(); flipCard(); }
    else if(deck.flipped && (k==='ArrowRight' || k==='2')){ e.preventDefault(); grade(true); }
    else if(deck.flipped && (k==='ArrowLeft' || k==='1')){ e.preventDefault(); grade(false); }
    return;
  }
  if(!quiz || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  let idx = 'abcd'.indexOf(k); if(idx<0) idx='1234'.indexOf(k);
  if(idx>=0 && k.length===1){ e.preventDefault(); choose(idx); return; }
  if(k==='enter' || k==='arrowright'){ if(k==='enter' && document.activeElement && document.activeElement.tagName==='BUTTON') return; e.preventDefault(); next(); }
  if(k==='arrowleft'){ prev(); }
});

renderSetup();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>
</body>
</html>
